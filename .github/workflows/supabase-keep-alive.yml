name: Supabase Keep-Alive

on:
  # Runs at 00:00 UTC every 3 days.
  # Supabase pauses the free-tier database after 7 days of inactivity,
  # so this provides a comfortable buffer before the pause threshold.
  schedule:
    - cron: "0 0 */3 * *"
  # Allows manual triggering from the GitHub Actions tab for testing.
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase keep-alive endpoint
    runs-on: ubuntu-latest

    steps:
      # Production domain: https://diptokarmakar.me
      # -L follows the 307 redirect to www.diptokarmakar.me at the Vercel edge.
      # -f fails on HTTP ≥ 400; -sS shows errors while suppressing progress.
      - name: Ping keep-alive endpoint
        run: |
          curl -f -sS -L -H "Cache-Control: no-cache" \
            "https://diptokarmakar.me/api/keep-alive" \
            > /tmp/keep-alive-response.json

      - name: Validate response body
        run: |
          echo "Response body:"
          cat /tmp/keep-alive-response.json
          jq -e '.success == true' /tmp/keep-alive-response.json > /dev/null || {
            echo "::error::Keep-alive endpoint did not return {\"success\": true}"
            exit 1
          }
